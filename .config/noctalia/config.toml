[bar]
order = [ "taskbar" ]

    [bar.taskbar]
    background_opacity = 0.69999998435378075
    center = [ "date", "clock", "weather_spacer", "weather" ]
    end = [
        "media",
        "media_spacer",
        "tray",
        "app_spacer",
        "notifications",
        "clipboard",
        "screenshot",
        "tool_spacer",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    font_weight = 600
    margin_edge = 1
    margin_ends = 10
    start = [ "launcher", "launcher_spacer", "wallpaper", "workspaces" ]
    thickness = 25

[battery]
warning_threshold = 25

[bluetooth]
connection_notifications = true

[calendar]
enabled = true

[control_center.calendar]
show_events_location = true
show_week_numbers = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1418.0
    output = "eDP-1"
    placement_height = 1600.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_colorize = true
external_ip_enabled = true
show_close_buttons = false

    [shell.launcher]
    app_grid = true
    default_view = "all"
    show_navigation_labels = false
    sort_by_usage = false
    track_usage = false

[theme]
builtin = "Catppuccin"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "thunderbird", "hyprtoolkit" ]

[widget.app_spacer]
length = 10
type = "spacer"

[widget.clock]
format = "{:%H:%M}"

[widget.control-center]
enabled = false

[widget.launcher_spacer]
type = "spacer"

[widget.media]
hide_when_no_media = true

[widget.media_spacer]
type = "spacer"

[widget.tool_spacer]
length = 10
type = "spacer"

[widget.wallpaper]
enabled = false

[widget.weather]
show_condition = false

[widget.weather_spacer]
type = "spacer"
