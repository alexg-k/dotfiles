[bar]
order = [ "taskbar" ]

    [bar.taskbar]
    background_opacity = 0.7
    center = [ "date", "clock", "weather_spacer", "weather" ]
    end = [ "media", "media_spacer", "tray", "group:g1", "group:g4", "group:g3", "group:g2", "control-center", "session" ]
    font_weight = 400
    margin_edge = 1
    margin_ends = 10
    scale = 1.2
    start = [ "launcher", "launcher_spacer", "wallpaper", "workspaces" ]
    thickness = 30

        [[bar.taskbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container_low"
        foreground = "#F2BECD"
        id = "g1"
        members = [ "notifications", "clipboard", "screenshot" ]
        opacity = 1.0
        padding = 6.0

        [[bar.taskbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container_low"
        foreground = "#9DDBE6"
        id = "g2"
        members = [ "input_volume", "volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.taskbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container_low"
        foreground = "secondary"
        id = "g3"
        members = [ "network", "network_rx", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.taskbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container_low"
        foreground = "primary"
        id = "g4"
        members = [ "temp", "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 25

[bluetooth]
connection_notifications = true

[calendar]
enabled = true

[control_center.calendar]
show_events_location = true
show_week_numbers = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false
transition = [ "zoom" ]

[plugins]
auto_update = "official"
enabled = []

[shell]
app_icon_colorize = true
external_ip_enabled = true
show_close_buttons = false

    [shell.launcher]
    app_grid = true
    default_view = "all"
    show_navigation_labels = false
    sort_by_usage = false
    track_usage = false

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Mauve-Lavender"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "thunderbird", "hyprtoolkit" ]

[wallpaper.default]
path = "~/Git/dotfiles/wallpaper.jpg"

[wallpaper.last]
path = "~/Git/dotfiles/wallpaper.jpg"

[wallpaper.monitors.eDP-1]
path = "~/Git/dotfiles/wallpaper.jpg"

[widget.app_spacer]
length = 10
type = "spacer"

[widget.clock]
format = "{:%H:%M}"

[widget.control-center]
enabled = false

[widget.date]
font_scale = 0.92
scale = 1.0

[widget.input_volume]
enabled = false

[widget.launcher]
custom_image = "~/Git/dotfiles/arch-icon.png"

[widget.launcher_spacer]
type = "spacer"

[widget.media]
hide_when_no_media = true

[widget.media_spacer]
type = "spacer"

[widget.network]
font_scale = 0.95

[widget.tool_spacer]
length = 10
type = "spacer"

[widget.wallpaper]
enabled = false

[widget.weather]
show_condition = false

[widget.weather_spacer]
type = "spacer"
