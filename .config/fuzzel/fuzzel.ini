[main]
font=JetBrainsMono Nerd Font:size=8
terminal=kitty -e
prompt="> "
placeholder=Search applications...
icon-theme=Adwaita
icons-enabled=yes
hide-before-typing=no
fields=filename,name,generic,keywords,categories,comment
match-mode=fzf
match-counter=yes
filter-desktop=no
show-actions=no
lines=12
width=50
horizontal-pad=24
vertical-pad=16
inner-pad=8
image-size-ratio=1
layer=overlay

[colors]
background=1e1e2edd
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=89b4faff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=7f849cff
border=89b4faff

[border]
width=2
radius=10
selection-radius=6
